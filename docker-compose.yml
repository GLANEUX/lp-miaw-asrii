services:
  web:
    build: .
    ports:
      - "8080:80"
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_URL_PREFIX: ${APP_URL_PREFIX:-}
    volumes:
      # Fichiers uploadés : bind mounts pour conserver les fichiers déjà présents dans le repo
      - ./public/supports_de_cours:/var/www/html/public/supports_de_cours
      - ./public/emplois_du_temps:/var/www/html/public/emplois_du_temps
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    # ports:
    #   - "3306:3306"   # décommenter pour accéder à la BDD depuis l'hôte
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
